[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qfoton"
version = "2.0.0"
description = "Full-Stack Silicon Photonic Quantum Computing Simulator and Compiler"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Atharve", email = "atharveeee@gmail.com" }]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
]
